services:
  valeo-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      COTIZACIONES_ADMIN_TOKEN: ${COTIZACIONES_ADMIN_TOKEN:-}
    restart: unless-stopped
    init: true
    read_only: true
    volumes:
      - cotizaciones_data:/app/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  cotizaciones_data:
